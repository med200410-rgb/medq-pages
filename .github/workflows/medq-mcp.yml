name: MedQ MCP checks
on:
  push:
    branches: [medq-hybrid-mcp]
    paths:
      - "mcp-server/**"
      - ".github/workflows/medq-mcp.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
